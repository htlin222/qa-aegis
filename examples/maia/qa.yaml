  - id: R18
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 3
    q: "Does daratumumab affect ABO typing or the crossmatch?"
    principle: "Daratumumab binds CD38 on red cells, not the ABO or RhD antigens; it interferes with antibody screening and crossmatch, not with typing."
    answer: >-
      ABO and RhD typing are not affected. The antibody screen and crossmatch are: the indirect antiglobulin test turns positive and can stay
      positive up to six months after the last dose. Blood banks use DTT-treated red cells to work around it.
    sources: [L1]

  - id: R19
    branch: practice
    persona: ai_senior
    cynefin: clear
    risk: 4
    q: "The AI told me: daratumumab 16 mg/kg weekly for 8 weeks, then monthly. Correct?"
    ai_answer: "Daratumumab is given at 16 mg/kg IV weekly for 8 weeks, then every 4 weeks until progression."
    blind_spot: "Drops the every-2-week phase in weeks 9 to 24 — a dosing error if followed."
    principle: "The schedule steps down in three phases as target binding saturates; skipping a phase under-doses during the period of highest disease burden."
    answer: >-
      Not quite — there are three phases, not two. Weekly for weeks 1 to 8, every two weeks for weeks 9 to 24, then every four weeks from week 25.
      Skipping the every-two-week phase under-doses exactly when disease burden is highest.
    followups:
      - q: "Is it the same for SC?"
        a: "Same schedule; the dose is a fixed 1,800 mg instead of 16 mg/kg."
    sources: [L1, L2]

  - id: R20
    branch: practice
    persona: statistician
    cynefin: complicated
    risk: 2
    q: "How many patients needed lenalidomide dose reductions, and does reduced dose intensity undermine efficacy?"
    principle: "In continuous therapy, duration on treatment contributes more to benefit than full dose intensity; dose reduction that keeps a patient on therapy usually preserves efficacy."
    answer: >-
      I'd quote the reduction rates from MAIA's safety tables. The principle matters more than the exact number: in continuous therapy, staying on
      treatment carries the benefit. A patient on 10 or 15 mg for years usually does better than one on 25 mg who stops at month four.
    sources: [L3]
