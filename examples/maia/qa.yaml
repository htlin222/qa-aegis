# ───────────────────────── POSITION ─────────────────────────
  - id: P01
    branch: position
    persona: ai_senior
    cynefin: complicated
    risk: 5
    attack: rebut
    q: "Isn't D-VRd now the standard for transplant-ineligible patients? The FDA approved it."
    oneliner: "Quads beat VRd (CEPHEUS HR 0.57, IMROZ 0.60), not D-Rd; OS immature. IFM 2026: DRd backbone; fit → add V; frail → DR."
    ai_answer: "Yes. CEPHEUS showed D-VRd improved MRD negativity and PFS over VRd, and the FDA approved D-VRd for transplant-ineligible NDMM, making quadruplets the new standard for fit patients."
    blind_spot: "CEPHEUS compared with VRd, not D-Rd; OS in the transplant-ineligible subgroup is immature (HR 0.66, CI crosses 1); IMROZ excluded patients over 80; IFM 2026 keeps DRd as backbone; quadruplets are not NHI-reimbursed here."
    principle: "A regimen is shown superior only to its comparator, and adding a drug helps only the patients who can tolerate it."
    answer: >-
      It depends on fitness. Quadruplets beat VRd — CEPHEUS PFS HR 0.57, IMROZ HR 0.60 — and the FDA approved D-VRd in January 2026.
      But neither compared with D-Rd, overall survival is still immature, and IMROZ enrolled only up to age 80. IFM 2026 keeps DRd as
      the backbone and adds bortezomib for fit patients. So: fit, consider a quadruplet; intermediate, D-Rd; frail, DR.
    followups:
      - q: "What's the CEPHEUS transplant-ineligible OS?"
        a: "HR 0.66, 95% CI 0.42 to 1.03 — favourable but immature."
    sources: [S11, S12, S10, S15, F1]

  - id: P02
    branch: position
