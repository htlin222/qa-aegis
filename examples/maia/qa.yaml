    risk: 5
    q: "OS hazard ratio 0.67 — so a third fewer patients die?"
    oneliner: "HR is relative. Absolute: 7-yr OS 53.1% vs 39.3% (≈14 points, NNT ≈7, speaker's arithmetic). Median OS 90.3 vs 64.1 mo."
    ai_answer: "Yes, an HR of 0.67 corresponds to a 33% reduction in the risk of death with D-Rd versus Rd."
    blind_spot: "Converts a relative hazard into a proportion of patients. The absolute difference at seven years is 14 percentage points."
    principle: "A hazard ratio compares instantaneous risk across the whole curve; it is not the proportion of patients saved."
    answer: >-
      Not quite. 0.67 means a 33% lower instantaneous risk of death, averaged over follow-up. The number a patient lives on is absolute:
      at seven years, 53.1% versus 39.3% alive — about 14 percentage points, roughly one extra survivor at seven years for every
      seven treated (speaker's arithmetic). Median OS 90.3 versus 64.1 months.
    followups:
      - q: "Isn't NNT 7 just an estimate?"
        a: "Yes — it's time-specific and derived from Kaplan-Meier estimates. At five years it's about 8 (66.6% vs 53.6%)."
    sources: [S4, S3]

  - id: W02
