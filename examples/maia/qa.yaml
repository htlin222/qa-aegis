  - id: R16
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "What pregnancy-prevention requirements apply to lenalidomide?"
    principle: "Thalidomide analogues are teratogenic as a class; exposure prevention is enforced through a restricted-distribution program."
    answer: >-
      Lenalidomide carries a boxed warning for embryo-fetal toxicity and is distributed under a restricted program in the US; in Taiwan a risk
      management plan applies. Pregnancy testing and contraception are required for patients who can become pregnant, and lenalidomide is present
      in semen, so male patients need condoms.
    followups:
      - q: "Male patients too?"
        a: "Yes — lenalidomide is present in semen, so condoms are required even after vasectomy, per the US program."
    sources: [L3]
    verify: "Taiwan lenalidomide RMP requirements (TFDA 仿單 / 風險管理計畫)"

  - id: R17
    branch: practice
    persona: payer
    cynefin: clear
    risk: 3
    q: "Does NHI cover subcutaneous daratumumab?"
    principle: "Reimbursement attaches to the listed product and indication; a new route needs its own listing."
    answer: >-
      Yes, within the same indications — rule 9.78, as revised effective 1 September 2025, names both Darzalex IV and subcutaneous injection.
      The indication limits still apply: frontline only with VTd for transplant-eligible patients.
