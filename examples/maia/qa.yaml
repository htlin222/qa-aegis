  - {item: "Daratumumab SC", value: "1,800 mg / 30,000 U hyaluronidase, abdomen, 3-5 min; same schedule", source: L2}
  - {item: "Daratumumab dose reduction", value: "None. Withhold for toxicity (e.g. to allow count recovery)", source: L1}
  - {item: "Pre-medication (1-3 h before)", value: "Dex 20 mg (background dex serves as premed) + acetaminophen 650-1,000 mg + diphenhydramine 25-50 mg", source: L1}
  - {item: "Lenalidomide", value: "25 mg D1-21 q28d", source: L3}
  - {item: "Lenalidomide, CrCl 30-60", value: "10 mg daily; may escalate to 15 mg after 2 cycles if tolerated", source: L3}
  - {item: "Lenalidomide, CrCl <30, no dialysis", value: "15 mg every other day", source: L3}
  - {item: "Lenalidomide, dialysis", value: "5 mg daily; after dialysis on dialysis days", source: L3}
  - {item: "Lenalidomide, ANC <1,000 / plt <30k", value: "Interrupt; resume at next lower dose (ANC only toxicity: resume 25 mg); not below 2.5 mg", source: L3}
  - {item: "Dexamethasone (MAIA)", value: "40 mg weekly; 20 mg weekly if age >75 or BMI <18.5", source: L1}
  - {item: "Zoster prophylaxis", value: "Start within 1 wk of daratumumab; continue 3 mo after end", source: L1}
  - {item: "Before first dose", value: "Type and screen (IAT interference up to 6 mo after last dose)", source: L1}
  - {item: "Thromboprophylaxis", value: "Recommended with lenalidomide + dex (boxed warning); agent by risk", source: L3, verify: "Agent selection (aspirin vs LMWH) per IMWG/ASCO — cite guideline"}

questions:

# ───────────────────────── CREDIBLE ─────────────────────────
  - id: C01
    branch: credible
    persona: ai_senior
    cynefin: complicated
    risk: 5
    attack: undermine
    q: "Rd isn't a real comparator anymore — VRd already beat it in SWOG S0777. Didn't MAIA just beat a straw man?"
    oneliner: "Rd was the label standard at enrolment (2015-17). D-Rd beats Rd; vs VRd only an Rd-anchored ITC (HR 0.59). Triplet vs quad = CEPHEUS/IMROZ."
    ai_answer: "MAIA compared D-Rd with Rd, a standard at the time. Since VRd has shown superiority over Rd, many experts consider the comparator outdated."
    blind_spot: "No date logic: MAIA enrolled 2015-17 and S0777 was published in 2017, with transplant-intent patients included. No mention that the only D-Rd vs VRd evidence is an Rd-anchored indirect comparison, or that the quadruplet trials compared against VRd, not D-Rd."
    principle: "A randomized trial answers 'better than this comparator'; whether that matters today depends on whether the comparator was standard when patients were enrolled and how it links to today's standard."
    answer: >-
      It depends on which year you mean. MAIA enrolled from 2015 to 2017, when Rd was the label standard for transplant-ineligible patients;
      S0777 was published in 2017 and also enrolled patients with transplant intent. So Rd was a fair control then.
      Today the honest claim is narrower: D-Rd beats Rd. Against VRd we only have an Rd-anchored indirect comparison favouring D-Rd, HR 0.59 —
      hypothesis-level. The direct triplet-versus-quadruplet answer comes from CEPHEUS and IMROZ, not MAIA.
    followups:
      - q: "Is an indirect comparison worth anything?"
        a: "It adjusts for measured differences only. Era, subsequent therapy and assessment schedules differ. I treat it as consistent with, not proof of."
      - q: "Then why not just give VRd?"
        a: "For a fit patient I'd add bortezomib to the antibody backbone rather than choose between them — that's what CEPHEUS and IMROZ tested."
    sources: [S2, S8, S9, S10, S11]

  - id: C02
    branch: credible
    persona: statistician
    cynefin: clear
    risk: 4
    q: "The 2021 OS result came from an interim analysis. Are we over-reading an early look?"
    principle: "An interim analysis spends alpha against a stricter prespecified boundary; a result that crosses it is valid, and later updates are descriptive."
    answer: >-
      The data are clear: the interim OS analysis crossed its prespecified stopping boundary — p = 0.0013 against a boundary of 0.0414, HR 0.68.
      Everything after that, including the final analysis at 89 months, is descriptive follow-up of a result already established.
      And the HR didn't drift: 0.66 at 64.5 months, 0.67 at final. A lucky early estimate usually shrinks; this one didn't.
    followups:
      - q: "Why does a stable HR matter?"
        a: "Random highs regress toward the truth with more events. Stability across three analyses argues the early effect was real."
    sources: [S2, S3, S4]

  - id: C03
    branch: credible
    persona: ai_senior
    cynefin: clear
    risk: 4
    attack: rebut
    q: "It was open-label. Isn't the PFS benefit biased?"
    ai_answer: "Open-label designs can bias progression-based endpoints, which is a recognized limitation of MAIA."
    blind_spot: "Omits that MAIA's PFS was centrally assessed and that OS — which no assessor can bias — moved the same way."
    principle: "Assessment bias affects endpoints that require judgment; centrally assessed endpoints and death resist it."
    answer: >-
      Fair concern for subjective endpoints. Two facts answer it: PFS in MAIA was centrally assessed, and overall survival — which an
      assessor cannot bias — went the same direction, HR 0.67 at final. When the unbiasable endpoint agrees, assessment bias isn't the explanation.
    followups:
      - q: "Could open-label affect treatment decisions, like earlier discontinuation in the control arm?"
        a: "It could affect behaviour. Time to next treatment was also longer with D-Rd, HR 0.51, which is hard to produce through behaviour alone."
    sources: [S2, S4]

  - id: C04
    branch: credible
    persona: statistician
    cynefin: complicated
    risk: 5
    attack: undercut
    q: "OS depends on what control patients received at relapse. How many Rd patients later got an anti-CD38 antibody?"
    oneliner: "OS compares 'anti-CD38 first' vs 'Rd first, then era access'. TTNT HR 0.51; gain held 7 yrs. Claim = up-front use, not 'timing never matters'."
    principle: "OS compares whole strategies including post-progression therapy; limited access to the experimental class in the control arm makes early use look better than use at any time."
    answer: >-
      Right — OS here compares 'anti-CD38 up front' with 'Rd first, then what was available'. The exact proportion of Rd patients who later
      received an anti-CD38 should be quoted from the final analysis. What supports the result: time to next treatment was much longer,
      HR 0.51, and the survival gain held through seven years. So I phrase the claim as: using daratumumab first, under that era's access,
      prolongs survival — not that timing never matters.
    followups:
      - q: "So saving daratumumab for relapse could be just as good?"
        a: "That's a sequencing question nobody has randomized. In older patients, attrition means many never reach second line — that's the bet you make by waiting."
    sources: [S4]
    verify: "Proportion of Rd patients receiving subsequent anti-CD38 therapy (Facon, Leukemia 2026, full text)"

  - id: C05
    branch: credible
    persona: statistician
    cynefin: complicated
    risk: 3
    q: "The Rd arm had a median PFS of 34.4 months — longer than older Rd series. Was this a selected population?"
    principle: "Control-arm outcomes reflect eligibility, era and supportive care; comparing control arms across trials is confounded, but randomization keeps the within-trial comparison fair."
    answer: >-
      Probably fitter than clinic patients: ECOG 0 to 2, adequate renal function. S0777's Rd arm had a median of 30 months, so 34.4 isn't out of line
      for continuous Rd in a trial population. Selection limits who the result applies to; it doesn't bias the randomized comparison.
    sources: [S3, S8, S2]
    verify: "MAIA renal eligibility threshold (CrCl ≥30 mL/min?) — NEJM 2019 Methods/protocol"

  - id: C06
    branch: credible
    persona: ai_senior
    cynefin: clear
    risk: 3
    q: "MRD negativity was only about 30% with D-Rd. Isn't that weak next to quadruplets at 60%?"
    ai_answer: "MAIA reported MRD-negativity of roughly 24-32% with D-Rd, lower than the ~60% reported with D-VRd in CEPHEUS."
    blind_spot: "MRD rates are not comparable across trials (timing, regimen, number of marrow assessments). Within MAIA the comparison is 32.1% vs 11.1%. MAIA has final OS; CEPHEUS OS is immature."
    principle: "MRD rates depend on threshold, denominator and when marrow is sampled; they compare fairly only within a trial."
    answer: >-
      The data are clear within the trial: 32.1% versus 11.1% at 10⁻⁵, intention-to-treat, and sustained MRD negativity 16.8% versus 3.3%.
      Across trials the numbers aren't comparable — different regimens, timing and assessment schedules. And MAIA has what the quadruplet trials
      don't yet have: a 7.5-year median overall survival.
    sources: [S3, S11, S4]

  - id: C07
    branch: credible
    persona: statistician
    cynefin: complicated
    risk: 2
    q: "Is MRD negativity a validated surrogate for overall survival in this setting?"
    principle: "A surrogate is validated when treatment effects on it predict treatment effects on survival across trials, not just when MRD-negative patients do better."
    answer: >-
      At the patient level MRD negativity strongly predicts longer PFS; trial-level validation for OS is the harder bar. That's why I don't lean
      on MRD for MAIA — MAIA doesn't need a surrogate, it has final OS. Where MRD matters is the quadruplet trials, whose OS is still immature.
    sources: [S4, S12]

  - id: C08
    branch: credible
    persona: ai_senior
    cynefin: chaotic
    risk: 4
    attack: rebut
    q: "Serious adverse events were higher with daratumumab. So it causes more harm while 'improving' survival?"
    ai_answer: "D-Rd was associated with more serious adverse events, particularly neutropenia and pneumonia, which should be weighed against the efficacy benefit."
    blind_spot: "Misses that OS already nets out toxic deaths, and that deaths due to adverse events were similar at final (12% vs 11%)."
    principle: "Overall survival counts every death, toxic or not; a positive OS difference already includes the harm."
    answer: >-
      Let me take the data part first. Serious adverse events were higher, 77% versus 70%, and deaths due to adverse events at the final analysis
      were 12% versus 11% — similar. Overall survival counts every death, and it favours D-Rd: 53% versus 39% alive at seven years.
      So the net is clearly positive. The extra harm is real and mostly infection, which is why prophylaxis and early vigilance matter.
    followups:
      - q: "What kind of deaths?"
        a: "Infection is the main excess: in the pooled MAIA and ALCYONE analysis, grade 5 infections were 3.0% versus 1.5%."
    sources: [S2, S4, S7]

  - id: C09
    branch: credible
    persona: statistician
    cynefin: clear
    risk: 2
    q: "How was randomization stratified, and could imbalance explain the result?"
    principle: "Stratified randomization balances the strongest prognostic factors by design; chance imbalance shrinks as sample size grows."
    answer: >-
      Stratified by ISS stage, region and age; 737 patients, 1:1. Baseline characteristics were similar between arms.
      Chance imbalance doesn't produce a PFS HR around 0.55 that is consistent across subgroups.
    sources: [S2, L1, S5]

  - id: C10
    branch: credible
    persona: ai_senior
    cynefin: complicated
    risk: 3
    q: "Daratumumab shows up on SPEP. Couldn't response or progression be misclassified?"
    ai_answer: "Daratumumab can interfere with SPEP and immunofixation, potentially affecting response assessment in IgG-kappa myeloma."
    blind_spot: "Doesn't say which direction: the interference makes a true CR look like residual disease — a bias against D-Rd, not for it."
    principle: "Daratumumab is itself an IgG-κ monoclonal antibody; on SPEP/IFE it can mimic residual M-protein, so it hides responses rather than creating them."
    answer: >-
      The interference is real — the label says daratumumab can be detected on SPEP and IFE in IgG-kappa patients. The direction matters:
      it can make a true complete response look like residual disease. That biases against D-Rd, not for it.
      In practice, a daratumumab-specific IFE reflex assay separates the drug from the disease.
    sources: [L1]
    verify: "Local availability of a daratumumab-specific IFE reflex assay"

  - id: C11
    branch: credible
    persona: statistician
    cynefin: complicated
    risk: 3
    q: "Did the OS curves separate early, or was there an early excess of deaths with D-Rd?"
    principle: "A single HR assumes proportional hazards; early toxic deaths followed by late benefit produce crossing curves that a single HR hides."
    answer: >-
      It depends on how the curve behaves, so I show it rather than describe it. What the numbers allow me to say: grade 3/4 infection risk peaked
      in the first six months in both arms, deaths due to adverse events were similar overall, and the OS HR stayed around 0.67 across three
      analyses. A large early excess would not leave the HR that stable.
    sources: [S4, S7]
    verify: "Inspect the final OS Kaplan-Meier figure for early crossing (Facon, Leukemia 2026)"

  - id: C12
    branch: credible
    persona: community
    cynefin: complicated
    risk: 3
    q: "Trial centres are expert centres. Will I get the same result in my clinic?"
    principle: "Efficacy in a trial becomes effectiveness in practice only if patients stay on therapy at adequate dose; adherence and supportive care carry the result."
    answer: >-
      It depends mostly on keeping patients on treatment. MAIA ran at 176 hospitals in 14 countries, not only academic centres.
      What erodes benefit in practice is early discontinuation — infection, steroid toxicity, logistics. So the transferable part is the
      supportive care: prophylaxis, dex reduction, SC administration, early review in the first six months.
    sources: [S2, S7]

  - id: C13
    branch: credible
    persona: pharmacist
    cynefin: clear
    risk: 2
    q: "Did both arms get the same lenalidomide and dexamethasone, or could the D-Rd arm simply have had more Rd?"
    principle: "A treatment effect can be attributed to the added drug only if the background therapy was protocol-identical between arms."
    answer: >-
      The data are clear: both arms had the same backbone — lenalidomide 25 mg days 1-21 and dexamethasone 40 mg weekly, 20 mg if older than 75
      or BMI under 18.5. On daratumumab days the dex served as premedication. The only planned difference was daratumumab.
    sources: [L1, S2]
    verify: "Delivered lenalidomide dose intensity by arm (MAIA safety tables)"

  - id: C14
    branch: credible
    persona: payer
    cynefin: complicated
    risk: 2
    q: "It's an industry-sponsored trial. Should a payer discount it?"
    principle: "Sponsorship bias acts through design choices — comparator, endpoint, reporting — so judge those choices rather than the funder."
    answer: >-
      Judge the design, not the funder. MAIA was funded by Janssen, prospectively registered, with centrally assessed PFS and an objective OS endpoint.
      The sponsor-shaped choice that matters is the comparator: Rd rather than VRd. That limits what it answers, not whether its answer is true.
    sources: [S1, S2]

# ───────────────────────── APPLICABLE ─────────────────────────
  - id: A01
    branch: applicable
    persona: ai_senior
    cynefin: complicated
    risk: 5
    attack: undermine
    q: "Only a tiny fraction of MAIA patients were Asian. Why should this apply to Taiwanese patients?"
    oneliner: "1% Asian in MAIA. Efficacy (CD38 biology) extrapolates; safety is personalised: dex 20 mg if BMI <18.5, zoster prophylaxis, early infection watch."
    ai_answer: "Asian patients were under-represented in MAIA, but daratumumab efficacy has generally been consistent across ethnic groups, so results are considered applicable."
    blind_spot: "Gives no number (1% Asian per the US label) and does not separate efficacy, which depends on biology, from tolerability, which depends on body size, frailty and care setting."
    principle: "The efficacy of a target-directed antibody transfers when the target and disease biology are the same; tolerability depends on body size, comorbidity and infection exposure, which differ more between populations."
    answer: >-
      Fair: the label reports 1% Asian patients in MAIA, so MAIA alone cannot answer this. I split the question. Efficacy depends on CD38
      biology, which isn't ethnic. Tolerability depends on body weight, frailty and infection exposure — and those I can adjust:
      dexamethasone 20 mg for BMI under 18.5, zoster prophylaxis, vigilance for infection in the first six months.
      So I extrapolate the efficacy and personalise the safety.
    followups:
      - q: "Any Asian data with daratumumab at all?"
        a: "Asian-enrolling daratumumab trials and regional real-world series exist; have the specific citation ready."
    sources: [L1, S7]
    verify: "Cite Asian daratumumab data (e.g. Asia-Pacific trials or Taiwanese real-world series)"

  - id: A02
    branch: applicable
    persona: community
    cynefin: complicated
    risk: 5
    q: "My patient is 84 and frail. D-Rd, or something gentler?"
    oneliner: "Frailty, not age. MAIA frail: PFS HR 0.64, OS CI crosses 1. IFM2017-03 (median age 81): DR, dex only 2 cycles, PFS 53.4 vs 22.5 mo."
    principle: "Fitness, not age, predicts tolerance; dexamethasone contributes much of the toxicity in frail patients, so removing it can keep the antibody's benefit at lower cost."
    answer: >-
      It depends on frailty, not age. In MAIA's frail subgroup PFS favoured D-Rd, HR 0.64, but the OS confidence interval crossed 1.
      The better evidence for the truly frail is IFM2017-03: median age 81, daratumumab-lenalidomide with dexamethasone only in the first two
      cycles beat Rd — median PFS 53.4 versus 22.5 months. For my frail 84-year-old, that's DR, dexamethasone-sparing. IFM 2026 says the same.
    followups:
      - q: "What did IFM2017-03 cost in toxicity?"
        a: "More grade 3-5 neutropenia, 55% vs 24%, but infections were similar, 19% vs 21%."
    sources: [S5, S6, S14, S15]

  - id: A03
    branch: applicable
    persona: statistician
    cynefin: complicated
    risk: 3
    attack: undermine
    q: "Frail patients had an OS HR of 0.79 with the CI crossing 1. So no survival benefit in the frail?"
    principle: "A non-significant subgroup is absence of evidence, not evidence of absence; subgroups test interaction and are usually underpowered."
    answer: >-
      That's a subgroup result, and it's underpowered: frailty was assessed retrospectively from age, Charlson index and ECOG.
      PFS, CR and MRD all favoured D-Rd in frail patients. What the data do support is that the OS gain is surest in non-frail
      patients — HR 0.53 — and less certain in the frail. That's why I use the dex-sparing approach there.
    sources: [S6, S14]

  - id: A04
    branch: applicable
    persona: community
    cynefin: complicated
    risk: 4
    q: "High-risk cytogenetics — is D-Rd enough?"
    principle: "A consistent relative effect on a worse baseline still leaves a worse absolute outcome; high-risk disease is where deeper regimens have the most room to help."
    answer: >-
      The relative benefit holds — PFS HR 0.59 in high-risk cytogenetics. But high-risk patients still do worse in absolute terms.
      In a fit high-risk patient I'd consider a quadruplet — D-VRd or Isa-VRd — where accessible. The isolated gain(1q) HR of 0.36 is
      a small post hoc subgroup; I wouldn't build a decision on it.
    followups:
      - q: "Which cytogenetic abnormalities count as high risk here?"
        a: "Use the trial's definition for the HR and today's IMWG definition for the patient; they are not the same, so say which you mean."
    sources: [S5, S15, S11, S10]

  - id: A05
    branch: applicable
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "CrCl is 25. Can I still use D-Rd?"
    principle: "Monoclonal antibodies are cleared by catabolism, not the kidney; lenalidomide is about 82% excreted unchanged in urine, so only lenalidomide needs adjusting."
    answer: >-
      Yes — adjust lenalidomide, not daratumumab. Label: CrCl under 30 not on dialysis, lenalidomide 15 mg every other day;
      on dialysis, 5 mg daily, after dialysis on dialysis days. Daratumumab's population PK showed no meaningful effect of CrCl 15 to 89.
      One caveat: patients this impaired were likely outside MAIA's eligibility, so efficacy here is extrapolated.
    followups:
      - q: "Will the dose go back up if renal function recovers?"
