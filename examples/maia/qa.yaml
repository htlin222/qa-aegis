    attack: undermine
    q: "Treatment until progression for five or more years. Who pays for that in Taiwan?"
    oneliner: "NHI 9.78 (eff. 2025-09-01): frontline dara only with VTd in transplant-eligible; otherwise at relapse with Rd/Vd. Rd frontline capped at 24 cycles (9.43). D-Rd up front ≈ self-pay."
    principle: "The cost of continuous therapy scales with its efficacy: the longer it works, the longer it is paid for."
    answer: >-
      That's the paradox of continuous therapy. In Taiwan, under rule 9.78 effective 1 September 2025, first-line daratumumab is reimbursed
      only with VTd for transplant-eligible patients; for everyone else it is reimbursed with Rd or Vd after failure of a bortezomib- or
      lenalidomide-containing regimen. Frontline lenalidomide-dex for transplant-ineligible patients is covered, with prior authorization
      every four cycles and a lifetime cap of 24 four-week cycles under rule 9.43. So D-Rd as tested in MAIA is largely self-pay up front here.
    followups:
      - q: "So what do most Taiwanese patients actually get?"
        a: "Commonly an NHI-covered frontline regimen, with daratumumab at first relapse — which is exactly the sequencing question MAIA can't answer."
    sources: [N1, N2]
