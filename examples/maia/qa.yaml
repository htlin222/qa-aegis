# ───────────────────────── PRACTICE ─────────────────────────
  - id: R01
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 5
    q: "What is the daratumumab IV dose and schedule in D-Rd?"
    oneliner: "16 mg/kg IV: weekly wk 1-8, q2w wk 9-24, q4w wk 25+ until PD (label §2.2)."
    principle: "Dosing is front-loaded to saturate CD38 target binding, after which less frequent dosing maintains exposure."
    answer: >-
      The label is specific: 16 mg/kg IV, weekly for weeks 1 to 8, every two weeks for weeks 9 to 24, then every four weeks from week 25
      until progression. In MAIA terms: weekly cycles 1-2, every 2 weeks cycles 3-6, every 4 weeks from cycle 7.
    followups:
      - q: "Missed dose?"
        a: "Give it as soon as possible and shift the schedule to keep the dosing interval."
    sources: [L1, S2]

  - id: R02
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 5
    q: "CrCl is 45. What lenalidomide dose?"
    oneliner: "CrCl 30-60: lenalidomide 10 mg daily D1-21; may escalate to 15 mg after 2 cycles. <30: 15 mg q48h; dialysis 5 mg daily post-HD."
    principle: "Lenalidomide is ~82% excreted unchanged in urine, and its clearance falls linearly with CrCl, so the dose must follow renal function."
    answer: >-
      The label is specific: CrCl 30 to 60, lenalidomide 10 mg once daily, days 1-21 of 28. If 10 mg is tolerated without dose-limiting toxicity
      for two cycles, you can escalate to 15 mg.
    followups:
      - q: "And if CrCl falls below 30?"
        a: "15 mg every other day; on dialysis, 5 mg daily, after dialysis on dialysis days."
    sources: [L3]

  - id: R03
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "Does daratumumab need a renal or hepatic dose adjustment?"
    principle: "IgG antibodies are cleared by target-mediated disposition and proteolytic catabolism, not by glomerular filtration or hepatic metabolism."
    answer: >-
      No renal adjustment. Population PK showed no clinically important effect of CrCl 15 to 89 or mild hepatic impairment; the effect of severe hepatic
      impairment is unknown. There are no dose reductions for daratumumab at all — you withhold it, not reduce it.
    followups:
      - q: "And severe hepatic impairment?"
        a: "Not studied. I'd give it with closer monitoring and say the data don't exist."
    sources: [L1]

  - id: R04
    branch: practice
    persona: community
    cynefin: clear
    risk: 4
    q: "What dexamethasone dose for an 80-year-old?"
    principle: "Dexamethasone's toxicity (infection, glucose, myopathy, delirium) rises with age and low body mass while its anti-myeloma contribution is modest in the antibody era."
    answer: >-
      In MAIA, dexamethasone was 40 mg weekly, reduced to 20 mg weekly for patients older than 75 or with BMI under 18.5. On daratumumab days
      the dex dose serves as the premedication. For a frail patient, IFM2017-03 supports stopping dexamethasone after the first two cycles.
    followups:
      - q: "Does lowering dex lose efficacy?"
        a: "In the frail, IFM2017-03 removed dex after two cycles and still beat Rd on PFS."
    sources: [L1, S14]

  - id: R05
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "What premedication before IV daratumumab?"
    principle: "First-dose reactions are driven by cytokine release on binding; steroid, antipyretic and antihistamine blunt it."
    answer: >-
      One to three hours before every infusion: a corticosteroid — in D-Rd, the background dexamethasone 20 mg counts — plus acetaminophen
      650 to 1,000 mg and diphenhydramine 25 to 50 mg. After the infusion, consider low-dose oral steroid the next day unless background dex is given that day.
    followups:
      - q: "Can premedication be reduced later?"
        a: "Reactions are mainly a first-infusion event; institutional protocols often taper the antihistamine and antipyretic after the first few doses."
    sources: [L1]

  - id: R06
    branch: practice
    persona: community
    cynefin: chaotic
    risk: 5
    q: "We started daratumumab without a type and screen and now the patient needs a transfusion. What do we do?"
    oneliner: "ABO/RhD typing unaffected. Emergency: non-crossmatched ABO/RhD-compatible RBCs. Tell blood bank → DTT-treated cells. IAT interference ≤6 mo."
    principle: "CD38 is expressed on red cells; bound daratumumab makes the indirect antiglobulin test panreactive, masking alloantibodies — but ABO and RhD typing are unaffected."
    answer: >-
      First the urgent part: ABO and RhD typing are not affected. If the transfusion is an emergency, give non-cross-matched ABO/RhD-compatible
      red cells per your blood bank. Then tell the blood bank the patient is on daratumumab; they can screen using DTT-treated red cells.
      The interference can persist up to six months after the last dose. Next time, type and screen before the first dose.
    followups:
      - q: "How long will the blood bank problem last?"
        a: "Up to six months after the last daratumumab dose, per the label."
    sources: [L1]

  - id: R07
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "Zoster prophylaxis — when to start and for how long?"
    principle: "Latent VZV reactivates when cellular immunity falls; prophylaxis must cover the period of immune suppression and its recovery."
    answer: >-
      The label is specific: start antiviral prophylaxis within one week of starting daratumumab and continue for three months after treatment ends.
      Agent and dose follow local practice — commonly acyclovir or valacyclovir.
    followups:
      - q: "Why three months after stopping?"
        a: "Cellular immunity takes months to recover; reactivation risk outlasts the drug."
    sources: [L1]
    verify: "Antiviral agent and dose per institutional protocol"

  - id: R08
    branch: practice
    persona: community
    cynefin: complicated
    risk: 4
    q: "The patient is anti-HBc positive. Can I give daratumumab?"
    principle: "Loss of immune control lets HBV reactivate from cccDNA in previously infected hepatocytes; risk depends on serostatus and is mitigated by monitoring or antiviral prophylaxis."
    answer: >-
      Yes, with a plan. The label reports HBV reactivation in under 1% of daratumumab-treated patients, including fatal cases.
      It depends on serostatus: HBsAg-positive patients need antiviral prophylaxis; HBsAg-negative, anti-HBc-positive patients need either
      prophylaxis or HBV DNA monitoring, per hepatology practice. Screen everyone before the first dose.
    followups:
      - q: "If I choose monitoring, how often?"
        a: "HBV DNA and ALT at regular intervals — commonly every 1-3 months — and start antivirals on detectable DNA."
    sources: [L1]
    verify: "HBV screening/prophylaxis recommendation — cite ASCO/AASLD or Taiwan hepatology guidance"

  - id: R09
    branch: practice
    persona: community
    cynefin: complicated
    risk: 4
    q: "Which thromboprophylaxis with lenalidomide-dexamethasone?"
    principle: "IMiDs are prothrombotic and dexamethasone adds to it; the prophylaxis intensity should match the patient's thrombotic risk."
    answer: >-
      The label carries a boxed warning for venous and arterial thrombosis with lenalidomide plus dexamethasone and recommends antithrombotic
      prophylaxis. Which agent depends on risk: aspirin for standard-risk patients, LMWH or a DOAC for higher-risk patients, per IMWG-style risk
      assessment.
    followups:
      - q: "Does adding daratumumab change thrombotic risk?"
        a: "The thrombotic driver is lenalidomide plus dexamethasone; prophylaxis decisions follow those two."
    sources: [L3]
    verify: "Cite thromboprophylaxis risk model (IMWG / ASCO) and DOAC data"

  - id: R10
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 4
    q: "ANC drops to 800 on day 14. What do I change?"
    principle: "Lenalidomide is myelosuppressive and dose-dependent; daratumumab is not dose-reduced, so the adjustment is to lenalidomide."
    answer: >-
      The label is specific: ANC below 1,000 — interrupt lenalidomide and check counts weekly. When ANC is back to at least 1,000: if neutropenia
      was the only toxicity, resume at 25 mg or the starting dose; if there were other toxicities, resume one dose level lower, never below 2.5 mg.
      Daratumumab isn't reduced; withhold it if needed for count recovery.
    followups:
      - q: "G-CSF instead of holding?"
        a: "Commonly used to maintain dose intensity, per institutional practice; the label's rule is to interrupt below 1,000."
    sources: [L3, L1]

  - id: R11
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 3
    q: "Platelets fall below 30,000. What then?"
    principle: "Thrombocytopenia from lenalidomide is dose-dependent and reversible; dose de-escalation is stepwise."
    answer: >-
      Interrupt lenalidomide and check counts weekly. When platelets return to at least 30,000, resume at the next lower dose. For each subsequent drop,
      repeat — never below 2.5 mg daily.
    sources: [L3]

  - id: R12
    branch: practice
    persona: community
    cynefin: clear
    risk: 4
    q: "How common are infusion reactions, and how do I run the first infusion?"
    principle: "Infusion reactions are driven by antigen burden and are largely a first-exposure phenomenon; slow first infusion or SC route reduces them."
    answer: >-
      Infusion reactions occurred in 37% at the first IV infusion, 2% at the second and 6% cumulatively after that. First dose: 1,000 mL,
      start at 50 mL/h, increase by 50 mL/h every hour to a maximum of 200 mL/h — or split 8 mg/kg over days 1 and 2. With subcutaneous
      daratumumab, systemic administration reactions were 7% at the first injection.
    followups:
      - q: "What if a reaction happens?"
        a: "Interrupt, treat, and once symptoms resolve restart at no more than half the rate at which it occurred; permanently stop for grade 4."
    sources: [L1, L2]

  - id: R13
    branch: practice
    persona: pharmacist
    cynefin: clear
    risk: 3
    q: "MAIA used IV. Can I use subcutaneous daratumumab with Rd?"
    principle: "Hyaluronidase allows a large fixed SC dose to be absorbed; a fixed dose achieves therapeutic exposure across body weights."
    answer: >-
      Yes. MAIA used IV 16 mg/kg, but the subcutaneous label includes the D-Rd combination at 1,800 mg with 30,000 units hyaluronidase,
      given over 3 to 5 minutes into the abdomen, on the same schedule.
    sources: [L2, S2]

  - id: R14
    branch: practice
    persona: community
    cynefin: complicated
    risk: 3
    q: "My IgG-kappa patient has a persistent small M-spike on daratumumab. Is it residual disease?"
    principle: "Daratumumab is an IgG-κ protein; at low M-protein levels it can be the drug rather than the disease."
    answer: >-
      It depends on the isotype and the level. In IgG-kappa myeloma a small persistent band may be daratumumab itself — the label warns of
      false-positive SPE and IFE. A daratumumab-specific IFE reflex assay, or marrow assessment, settles whether the patient is in CR.
    sources: [L1]
    verify: "Local availability of daratumumab-specific IFE reflex assay"

  - id: R15
    branch: practice
    persona: community
    cynefin: complicated
    risk: 3
    q: "How do I reduce infection risk on D-Rd?"
    principle: "Risk is front-loaded: active disease, high-dose steroid and new anti-CD38 exposure coincide in the first months."
    answer: >-
      Concentrate effort early — in pooled MAIA and ALCYONE data, grade 3/4 infections peaked in the first six months. Zoster prophylaxis per label,
      HBV screening, vaccination before or early in therapy, dexamethasone reduction in older or underweight patients, and IVIG for patients with
      recurrent serious infections and hypogammaglobulinemia.
