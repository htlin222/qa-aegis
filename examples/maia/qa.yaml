    answer: >-
      We don't have a randomized sequencing trial. My reasoning: in older patients a meaningful share never receive second-line therapy,
      so 'saving' a drug often means never using it. MAIA's survival gain reflects using it when it's most likely to be received.
      In Taiwan the rules push daratumumab to relapse for most transplant-ineligible patients — so for many, the real decision is made by reimbursement.
    followups:
      - q: "Isn't the relapse harder if daratumumab is used first?"
