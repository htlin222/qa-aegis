  argdown: claims.argdown
  core_claims:
    - "D-Rd prolongs overall survival versus Rd: median OS 90.3 vs 64.1 months at 7.5 years of follow-up."
    - "The relative benefit holds in patients aged 75+ and with high-risk cytogenetics; in the frail, dexamethasone-sparing DR is the evidence-based option."
    - "D-Rd remains a first-line backbone; fit patients can add bortezomib (D-VRd / Isa-VRd)."
    - "In Taiwan, NHI rules place daratumumab at relapse, not up front, for transplant-ineligible patients."

